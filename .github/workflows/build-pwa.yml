# Builds the customer PWA (same steps as deploy/build-pwa.sh) and uploads it as an artifact.
# Runs on every change in mobile/; download the artifact into deploy/pwa and commit it.
name: Build PWA
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ["mobile/**", ".github/workflows/build-pwa.yml"] }
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - run: cd mobile && flutter pub get && bash ../deploy/build-pwa.sh
      - uses: actions/upload-artifact@v4
        with: { name: pwa, path: deploy/pwa, retention-days: 3 }
