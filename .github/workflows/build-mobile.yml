# Builds the customer app for Android and iOS on every change in mobile/ (and by hand).
# Artifacts: Android APK (install directly) + AAB (Google Play), iOS app (unsigned until Apple signing secrets exist).
# Optional secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Build mobile
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ["mobile/**", ".github/workflows/build-mobile.yml"] }
env:
  API_URL: https://qassa.kuw1.com
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - name: Store signing key (only if the secrets exist)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", KSP: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}", KA: "${{ secrets.ANDROID_KEY_ALIAS }}", KP: "${{ secrets.ANDROID_KEY_PASSWORD }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload.jks
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KSP" "$KA" "$KP" > android/key.properties
            echo "signed with the upload key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signed with the debug key (testing only, not for Google Play)"
          fi
      - run: flutter pub get
      - run: |
          V=$(python3 ../scripts/version.py)
          D="--dart-define=API_URL=$API_URL --dart-define=QASSA_VERSION=$V --dart-define=QASSA_CHANNEL=debug"
          flutter build apk --release $D
          flutter build appbundle --release $D
      - uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 14
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - run: flutter pub get
      - run: |
          V=$(python3 ../scripts/version.py)
          flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL --dart-define=QASSA_VERSION=$V --dart-define=QASSA_CHANNEL=debug
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/ && zip -qr qassa-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios-unsigned, path: mobile/qassa-unsigned.ipa, retention-days: 14 }
