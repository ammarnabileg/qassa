components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legal_entity:
          type: integer
        code:
          type: string
          maxLength: 20
        name_ar:
          type: string
          maxLength: 150
        name_en:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        is_postable:
          type: boolean
        is_control:
          type: boolean
        is_active:
          type: boolean
      required:
      - code
      - id
      - legal_entity
      - name_ar
      - name_en
      - type
    AdjustIn:
      type: object
      properties:
        branch_id:
          type: integer
        product_id:
          type: integer
        qty_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reason:
          type: string
          maxLength: 200
      required:
      - branch_id
      - product_id
      - qty_delta
      - reason
    AppointmentIn:
      type: object
      properties:
        branch_id:
          type: integer
        starts_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemIn'
        customer_id:
          type: integer
          nullable: true
        beneficiary_id:
          type: integer
          nullable: true
        walk_in_name:
          type: string
          default: ''
        source:
          allOf:
          - $ref: '#/components/schemas/AppointmentInSourceEnum'
          default: reception
        notes:
          type: string
          default: ''
      required:
      - branch_id
      - items
      - starts_at
    AppointmentInSourceEnum:
      enum:
      - reception
      - walk_in
      type: string
      description: |-
        * `reception` - reception
        * `walk_in` - walk_in
    AppointmentOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        branch:
          type: integer
        customer:
          type: integer
          nullable: true
        beneficiary:
          type: integer
          nullable: true
        walk_in_name:
          type: string
          maxLength: 120
        customer_name:
          type: string
          readOnly: true
        beneficiary_name:
          type: string
          readOnly: true
        customer_phone:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        source:
          $ref: '#/components/schemas/AppointmentOutSourceEnum'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        business_date:
          type: string
          format: date
        notes:
          type: string
        status_reason:
          type: string
          maxLength: 200
        invoice_id:
          type: integer
          nullable: true
          readOnly: true
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - beneficiary_name
      - branch
      - business_date
      - customer_name
      - customer_phone
      - ends_at
      - id
      - invoice_id
      - items
      - starts_at
    AppointmentOutSourceEnum:
      enum:
      - reception
      - walk_in
      - online
      type: string
      description: |-
        * `reception` - Reception
        * `walk_in` - Walk In
        * `online` - Online
    AppointmentStatusEnum:
      enum:
      - booked
      - arrived
      - in_service
      - completed
      - invoiced
      - cancelled
      - no_show
      type: string
      description: |-
        * `booked` - Booked
        * `arrived` - Arrived
        * `in_service` - In Service
        * `completed` - Completed
        * `invoiced` - Invoiced
        * `cancelled` - Cancelled
        * `no_show` - No Show
    Beneficiary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        relation:
          $ref: '#/components/schemas/RelationEnum'
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        notes:
          type: string
        is_active:
          type: boolean
      required:
      - full_name
      - id
      - relation
    BillIn:
      type: object
      properties:
        supplier_ref:
          type: string
          maxLength: 60
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        due_date:
          type: string
          format: date
          nullable: true
      required:
      - amount
      - supplier_ref
    BillPayIn:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        reference:
          type: string
          maxLength: 60
      required:
      - amount
      - reference
    BlankEnum:
      enum:
      - ''
    BookIn:
      type: object
      properties:
        branch_id:
          type: integer
        service_id:
          type: integer
        starts_at:
          type: string
          format: date-time
        beneficiary_id:
          type: integer
        staff_id:
          type: integer
          nullable: true
        notes:
          type: string
          default: ''
          maxLength: 300
      required:
      - beneficiary_id
      - branch_id
      - service_id
      - starts_at
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legal_entity:
          type: integer
        name_ar:
          type: string
          maxLength: 120
        name_en:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        timezone:
          type: string
          maxLength: 40
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
        online_booking:
          type: boolean
        is_active:
          type: boolean
      required:
      - business_type
      - code
      - id
      - legal_entity
      - name_ar
    BranchIn:
      type: object
      properties:
        name_ar:
          type: string
          maxLength: 120
        name_en:
          type: string
          default: ''
          maxLength: 120
        code:
          type: string
          maxLength: 20
          pattern: ^[-a-zA-Z0-9_]+$
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
      required:
      - business_type
      - code
      - name_ar
    BranchWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        legal_entity:
          type: integer
        name_ar:
          type: string
          maxLength: 120
        name_en:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        address:
          type: string
        phone:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
        online_booking:
          type: boolean
        is_active:
          type: boolean
      required:
      - business_type
      - code
      - id
      - legal_entity
      - name_ar
    BusinessTypeEnum:
      enum:
      - kids
      - men
      - women
      type: string
      description: |-
        * `kids` - Kids
        * `men` - Men
        * `women` - Women
    CashSessionStatusEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_ar:
          type: string
          maxLength: 80
        name_en:
          type: string
          maxLength: 80
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        sort:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - business_type
      - id
      - name_ar
    CheckoutIn:
      type: object
      properties:
        branch_id:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLineIn'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/SalePaymentIn'
        customer_id:
          type: integer
          nullable: true
        beneficiary_id:
          type: integer
          nullable: true
        appointment_id:
          type: integer
          nullable: true
        expected_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
          nullable: true
        coupon_code:
          type: string
          default: ''
          maxLength: 30
        redeem_points:
          type: integer
          minimum: 0
          default: 0
        tip:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
          default: '0.000'
        tip_staff_id:
          type: integer
          nullable: true
      required:
      - branch_id
      - lines
    ChildIn:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 120
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - full_name
    CloseIn:
      type: object
      properties:
        counted_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
          nullable: true
        denominations:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        notes:
          type: string
          default: ''
    CollectIn:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/SalePaymentIn'
      required:
      - payments
    Coupon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 30
        kind:
          $ref: '#/components/schemas/CouponKindEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        min_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        max_uses:
          type: integer
          maximum: 2147483647
          minimum: 0
