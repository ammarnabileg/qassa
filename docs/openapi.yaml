          application/json:
            schema:
              $ref: '#/components/schemas/EntryIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntryIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntryIn'
        required: true
