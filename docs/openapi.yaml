        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/TenantStatusEnum'
        default_business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        plan:
          type: string
        branches:
          type: integer
        hosts:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branches
      - created_at
      - hosts
      - id
      - name
      - slug
    TenantStatusEnum:
      enum:
      - trial
      - active
      - past_due
      - read_only
      - suspended
      type: string
      description: |-
        * `trial` - Trial
        * `active` - Active
        * `past_due` - Past Due
        * `read_only` - Read Only
        * `suspended` - Suspended
    TrialBalance:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TBRow'
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
        balanced:
          type: boolean
      required:
      - balanced
      - rows
      - total_credit
      - total_debit
    TypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
